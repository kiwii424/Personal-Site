
<!doctype html>
<html lang="en" data-locale="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio | English</title>
  <link rel="stylesheet" href="/assets/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="floating-icons" aria-label="social links">
    <div class="iconbar" id="social-icons"></div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="name" id="brand-name">...</div>
        <div class="role" id="brand-role">...</div>
      </div>

      <nav class="nav" id="side-nav"></nav>


<div class="actions">
        <select class="btn" data-lang-select>
          <option value="en" selected>English</option>
          <option value="zh" >中文</option>
        </select>
        <a class="btn" id="resume-btn" href="/docs/resize.jpeg" target="_blank" rel="noreferrer">Resume PDF</a>
      </div>
    </aside>

    <main class="main">
      <div class="container">
        <div class="hero">
<h1 class="h1" id="hero-name">...</h1>
          <p class="sub" id="hero-headline">...</p>
</div>

        <section class="section" id="about" data-section>
          <h2 id="about-title">...</h2>
          <div class="card">
            <div class="about-name" id="about-name">...</div>
            <div class="grid">
              <div class="photo"><img id="profile-photo" src="/assets/pics/profile.jpg" alt="profile photo"/></div>
              <div>
                <div id="about-body"></div>
                <div class="kv" id="contact-links"></div>
                <div class="about-mini" id="about-mini"></div>
              </div>
            </div>
          </div>
        
        <div class="about-badges">
</div>
      </section>

        <section class="section" id="skills" data-section>
          <h2 id="skills-title">...</h2>
          <p class="hint" id="skills-hint"></p>
          <div class="chips" id="skill-chips"></div>
        </section>

        <section class="section" id="competitions" data-section>
          <h2 id="competitions-title">...</h2>
          <p class="hint" id="competitions-hint"></p>
          <div class="list" id="competitions-list"></div>
          <div class="card hidden" id="competitions-empty" style="margin-top:12px">
            <b id="empty-competitions-text">No items match this skill filter.</b>
          </div>
        </section>





        



        

        <section class="section" id="course-projects" data-section>
          <h2 id="course-title">...</h2>
          <p class="hint" id="course-hint"></p>
          <div class="list" id="course-list"></div>
          <div class="card hidden" id="course-empty" style="margin-top:12px">
            <b id="empty-course-text">No course projects match current filters.</b>
          </div>
        </section>

        

        <section class="section" id="classes" data-section>
          <h2 id="classes-title">...</h2>
          <p class="hint" id="classes-hint"></p>
          <div class="classes-wrap">
  <div class="classes-block classes-uiuc">
    <div class="classes-head">
      <div class="classes-block-title" id="classes-uiuc-title">UIUC</div>
      <div class="classes-block-sub" id="classes-uiuc-sub"></div>
    </div>
    <div class="classes-grid classes-grid-row" id="classes-uiuc-grid"></div>
  </div>
  <div class="classes-block classes-nycu">
    <div class="classes-head">
      <div class="classes-block-title" id="classes-nycu-title">NYCU</div>
      <div class="classes-block-sub" id="classes-nycu-sub"></div>
    </div>
    <div class="classes-grid" id="classes-nycu-grid"></div>
  </div>
</div>
        </section>

        <section class="section" id="certifications" data-section>
          <h2 id="certs-title">...</h2>
          <p class="hint" id="certs-hint"></p>
          <div class="list" id="certs-list"></div>
        

</div>
</section>

        <section class="section" id="activities" data-section>
  <h2 class="section-title">Extracurricular Activities</h2>
  <div class="activities-tabs" id="activities-tabs"></div>
  <div class="activities-panel" id="activities-panel">
    <div class="activities-album" id="activities-album"></div>
    <div class="activities-text" id="activities-text"></div>
  </div>
</section>

        <section class="section" id="more" data-section>
  <h2 class="section-title">More About Me</h2>
  <p class="hint" id="more-hint"></p>
  <div class="more-grid" id="more-grid"></div>
</section>



        <section class="section" id="contact" data-section>
          <h2 id="contact-title">...</h2>
          <p class="hint" id="contact-note"></p>

          <div class="card">
            <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/en/thanks/">
              <input type="hidden" name="form-name" value="contact" />
              <p class="hidden">
                <label>Don’t fill this out if you’re human: <input name="bot-field" /></label>
              </p>

              <div class="form">
                <div class="row">
                  <div>
                    <label for="name" id="label-name">Name</label>
                    <input id="name" name="name" type="text" required />
                  </div>
                  <div>
                    <label for="email" id="label-email">Email</label>
                    <input id="email" name="email" type="email" required />
                  </div>
                </div>

                <div>
                  <label for="message" id="label-message">Message</label>
                  <textarea id="message" name="message" required></textarea>
                </div>

                <button class="btn" id="btn-send" type="submit">Send</button>
              </div>
            </form>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="/assets/app.js?v=20251222b"></script>
</body>
</html>
