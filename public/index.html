<!doctype html>
<html lang="zh-Hant" data-theme="light" data-font="wenkai" data-density="normal" data-cursor="on">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>黃淯琪 Meredith Huang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Space+Mono:wght@700&family=Noto+Sans+TC:wght@500;600;700&family=Great+Vibes&family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=LXGW+WenKai+TC:wght@400;700&family=Huninn&family=Iansui&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="intro.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
/* Meredith Huang — Personal Site
   Editorial / literary magazine aesthetic.
   Serif type pairing; warm paper / deep ink; terracotta accent.
*/

:root {
  /* Typography stacks (tweakable via data-font) */
  --font-display: "Anton", "Noto Sans TC", sans-serif;
  --font-body: "Noto Sans TC", system-ui, sans-serif;
  --font-mono: "Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  /* Core palette — riso light */
  --paper: #F2EEE4;
  --paper-2: #F6F5F1;
  --ink: #171717;
  --ink-muted: #43403a;
  --ink-soft: #76705f;
  --hairline: rgba(23, 23, 23, 0.4);
  --hairline-soft: rgba(23, 23, 23, 0.16);

  /* Accent (tweakable) */
  --accent: #E15A5A;
  --accent-ink: #171717;

  /* Density */
  --space-unit: 1rem;
  --sidebar-w: 232px;

  /* Motion */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
}

[data-theme="dark"] {
  --paper: #171717;
  --paper-2: #211f1c;
  --ink: #F4F2ED;
  --ink-muted: #c9c4b8;
  --ink-soft: #8d877a;
  --hairline: rgba(244, 242, 237, 0.4);
  --hairline-soft: rgba(244, 242, 237, 0.16);
}

[data-density="compact"] { --space-unit: 0.78rem; }
[data-density="comfy"]   { --space-unit: 1.15rem; }

[data-font="mono-sans"] {
  --font-display: "Space Mono", ui-monospace, monospace;
  --font-body: "Noto Sans TC", system-ui, sans-serif;
}
[data-font="wenkai"] {
  --font-display: "LXGW WenKai TC", "Cormorant Garamond", serif;
  --font-body: "LXGW WenKai TC", Georgia, serif;
}
[data-font="round"] {
  --font-display: "Huninn", "Noto Sans TC", sans-serif;
  --font-body: "Huninn", system-ui, sans-serif;
}
[data-font="iansui"] {
  --font-display: "Iansui", "Noto Sans TC", sans-serif;
  --font-body: "Iansui", system-ui, sans-serif;
}
[data-font="serif-classic"] {
  --font-display: "Cormorant Garamond", "Noto Serif TC", Georgia, serif;
  --font-body: "EB Garamond", "Noto Serif TC", Georgia, serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.58;
  -webkit-font-smoothing: antialiased;
  transition: background 420ms var(--ease-out), color 420ms var(--ease-out);
}

body {
  min-height: 100vh;
  text-wrap: pretty;
}

a { color: inherit; text-decoration: none; }

h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 500; letter-spacing: -0.01em; line-height: 1.08; margin: 0; }
h1 { font-size: clamp(2.6rem, 7.2vw, 5.4rem); font-weight: 400; }
h2 { font-size: clamp(1.7rem, 3.2vw, 2.4rem); font-weight: 400; }
h3 { font-size: 1.28rem; font-weight: 500; }

p { margin: 0; }

/* ──────────── Cursor spotlight ──────────── */
.spotlight {
  position: fixed;
  pointer-events: none;
  width: 520px; height: 520px;
  left: 0; top: 0;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in oklab, var(--accent) 26%, transparent), transparent 72%);
  mix-blend-mode: multiply;
  z-index: 1;
  opacity: 0;
  transition: opacity 380ms var(--ease-out);
  will-change: transform;
}
[data-theme="dark"] .spotlight { mix-blend-mode: screen; }
[data-cursor="on"] .spotlight { opacity: 1; }

/* ──────────── Top Nav ──────────── */
.topnav {
  position: sticky;
  top: 0;
  z-index: 40;
  background: color-mix(in oklab, var(--paper) 88%, transparent);
  backdrop-filter: saturate(1.2) blur(10px);
  -webkit-backdrop-filter: saturate(1.2) blur(10px);
  border-bottom: 1px solid var(--hairline-soft);
}
.topnav-inner {
  max-width: 1400px;
  margin: 0 auto;
  padding: calc(var(--space-unit) * 0.9) calc(var(--space-unit) * 1.4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: calc(var(--space-unit));
}
.brand {
  font-family: var(--font-display);
  font-size: 1.25rem;
  font-weight: 500;
  letter-spacing: 0.01em;
  display: flex;
  align-items: center;
  gap: 0.6em;
}
.brand .dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent);
  display: inline-block;
  transition: transform 420ms var(--ease-out);
}
.brand:hover .dot { transform: scale(1.4) rotate(45deg); }

.nav-links {
  display: flex; gap: calc(var(--space-unit) * 1.6);
  align-items: center;
}
.nav-link {
  position: relative;
  font-family: var(--font-body);
  font-size: 0.97rem;
  color: var(--ink-muted);
  padding: 0.3rem 0.1rem;
  transition: color 280ms var(--ease-out);
  cursor: pointer;
}
.nav-link::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -2px;
  height: 1px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 340ms var(--ease-out);
}
.nav-link:hover { color: var(--ink); }
.nav-link:hover::after { transform: scaleX(1); }
.nav-link.active { color: var(--ink); }
.nav-link.active::after { transform: scaleX(1); }

.nav-controls {
  display: flex; align-items: center; gap: calc(var(--space-unit) * 0.5);
}
.pill {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.42rem 0.72rem;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  background: transparent;
  color: var(--ink-muted);
  cursor: pointer;
  transition: all 260ms var(--ease-out);
  line-height: 1;
  display: inline-flex;
  align-items: center;
  gap: 0.4em;
}
.pill:hover { color: var(--ink); border-color: var(--ink); transform: translateY(-1px); }

.pill-icon {
  display: inline-flex;
  width: 28px; height: 28px;
  align-items: center; justify-content: center;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  color: var(--ink-muted);
  cursor: pointer;
  background: transparent;
  transition: all 260ms var(--ease-out);
}
.pill-icon:hover { color: var(--ink); border-color: var(--ink); transform: translateY(-1px); }

.lang-toggle {
  display: inline-flex;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  overflow: hidden;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.06em;
}
.lang-toggle button {
  padding: 0.42rem 0.7rem;
  background: transparent;
  color: var(--ink-muted);
  border: none;
  cursor: pointer;
  line-height: 1;
  transition: all 260ms var(--ease-out);
}
.lang-toggle button.on {
  background: var(--ink);
  color: var(--paper);
}

/* ──────────── Mobile nav toggle ──────────── */
.nav-mobile-btn { display: none; }
@media (max-width: 780px) {
  .nav-links { display: none; }
  .nav-mobile-btn { display: inline-flex; }
  .nav-mobile-open .nav-links {
    display: flex;
    position: absolute;
    top: 100%;
    left: 0; right: 0;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 0.5rem;
    background: var(--paper);
    border-bottom: 1px solid var(--hairline-soft);
    padding: calc(var(--space-unit) * 0.8) calc(var(--space-unit) * 1.4);
    box-shadow: 0 14px 30px -18px rgba(0,0,0,0.25);
  }
  .nav-mobile-open .nav-link { border: 1px solid var(--hairline); padding: 0.45rem 0.9rem; font-size: 0.95rem; }
  .nav-mobile-open .nav-link::after { display: none; }
  .nav-mobile-open .nav-link.active { border-color: var(--accent); color: var(--accent); }
}

/* ──────────── Generic page ──────────── */
.page {
  max-width: 1400px;
  margin: 0 auto;
  padding: calc(var(--space-unit) * 2) calc(var(--space-unit) * 1.4);
}

.fade-in {
  opacity: 0;
  transform: translateY(22px);
  transition: opacity 900ms var(--ease-out), transform 900ms var(--ease-out);
}
.fade-in.in {
  opacity: 1;
  transform: none;
}

/* ──────────── HOME / Hero ──────────── */
.hero {
  min-height: calc(100vh - 68px);
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  gap: calc(var(--space-unit) * 3);
  align-items: center;
  padding: calc(var(--space-unit) * 3) calc(var(--space-unit) * 1.4);
  max-width: 1400px;
  margin: 0 auto;
  position: relative;
}
.hero-eyebrow {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 1.2rem;
  display: flex;
  align-items: center;
  gap: 0.8em;
}
.hero-eyebrow::before {
  content: "";
  width: 32px; height: 1px;
  background: var(--accent);
}
.hero-title {
  font-weight: 400;
  margin: 0 0 0.2em 0;
  line-height: 1.1;
}
.hero-title em {
  font-style: italic;
  color: var(--accent);
  font-family: var(--font-display);
}
.hero-tagline {
  font-family: var(--font-display);
  font-style: italic;
  color: var(--ink-muted);
  font-size: clamp(1.15rem, 1.8vw, 1.5rem);
  margin-top: 0.4rem;
  margin-bottom: 1.8rem;
}
.hero-intro {
  max-width: 40ch;
  color: var(--ink-muted);
  font-size: 1.08rem;
  margin-bottom: 2rem;
}
.hero-ctas {
  display: flex;
  gap: calc(var(--space-unit) * 1);
  flex-wrap: wrap;
}
.cta {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 0.6em;
  padding: 0.9rem 1.4rem;
  font-family: var(--font-display);
  font-size: 1.05rem;
  letter-spacing: 0.01em;
  border: 1px solid var(--ink);
  color: var(--ink);
  background: transparent;
  cursor: pointer;
  overflow: hidden;
  transition: color 360ms var(--ease-out);
  border-radius: 2px;
}
.cta::before {
  content: "";
  position: absolute; inset: 0;
  background: var(--ink);
  transform: translateY(101%);
  transition: transform 420ms var(--ease-out);
  z-index: 0;
}
.cta > * { position: relative; z-index: 1; }
.cta:hover { color: var(--paper); }
.cta:hover::before { transform: translateY(0); }
.cta.primary { background: var(--ink); color: var(--paper); }
.cta.primary::before { background: var(--accent); }
.cta.primary:hover { color: var(--accent-ink); }

.hero-aside {
  position: relative;
  border-left: 1px solid var(--hairline);
  padding-left: calc(var(--space-unit) * 2);
  min-height: 380px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1.6rem;
}
.hero-meta {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.hero-meta b {
  display: block;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.35rem;
  color: var(--ink);
  letter-spacing: 0;
  text-transform: none;
  margin-top: 0.25rem;
}
.hero-marginalia {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 1.05rem;
  color: var(--ink-muted);
  line-height: 1.5;
  max-width: 32ch;
}
.hero-marginalia::before {
  content: "“";
  display: block;
  font-size: 3.8rem;
  line-height: 0.3;
  color: var(--accent);
  margin-bottom: 1.5rem;
  font-family: var(--font-display);
}

@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; gap: calc(var(--space-unit) * 2); min-height: auto; }
  .hero-aside { border-left: none; padding-left: 0; border-top: 1px solid var(--hairline); padding-top: calc(var(--space-unit) * 2); min-height: auto; }
}

/* ──────────── PROFESSIONAL page (sidebar + content) ──────────── */
.prof-layout {
  max-width: 1400px;
  margin: 0 auto;
}
.prof-sidebar {
  position: sticky;
  top: 92px;
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
}
.prof-sidebar .eyebrow {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 0.8rem;
  padding-left: 0.15rem;
}
.prof-side-link {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.55rem 0.15rem;
  font-family: var(--font-body);
  font-size: 1rem;
  color: var(--ink-muted);
  cursor: pointer;
  border-left: 1px solid transparent;
  padding-left: 0.9rem;
  margin-left: -0.9rem;
  transition: all 260ms var(--ease-out);
  position: relative;
}
.prof-side-link .num {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--ink-soft);
  letter-spacing: 0.06em;
}
.prof-side-link:hover {
  color: var(--ink);
  border-left-color: var(--hairline);
  transform: translateX(2px);
}
.prof-side-link.active {
  color: var(--ink);
  border-left-color: var(--accent);
}
.prof-side-link.active .num { color: var(--accent); }

.prof-download {
  margin-top: calc(var(--space-unit) * 1.4);
  padding-top: calc(var(--space-unit) * 1);
  border-top: 1px solid var(--hairline-soft);
  font-family: var(--font-mono);
  font-size: 0.74rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-muted);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.5em;
  transition: color 280ms var(--ease-out);
}
.prof-download:hover { color: var(--accent); }

.prof-content { min-width: 0; max-width: 880px; margin: 0 auto; padding: calc(var(--space-unit) * 1.6) calc(var(--space-unit) * 1.4) calc(var(--space-unit) * 2.4); }
.prof-section {
  padding: calc(var(--space-unit) * 2.4) 0;
  border-top: 1px solid var(--hairline-soft);
  scroll-margin-top: 92px;
}
.prof-section:first-child { border-top: none; padding-top: 0; }
.prof-section h2 {
  margin-bottom: 1.6rem;
  display: flex;
  align-items: baseline;
  gap: 1rem;
}
.prof-section h2 .num {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--ink-soft);
  letter-spacing: 0.1em;
}

/* About big type */
.about-lead {
  font-family: var(--font-display);
  font-size: clamp(1.45rem, 2.4vw, 2rem);
  line-height: 1.35;
  color: var(--ink);
  max-width: 34ch;
  margin-bottom: 1.6rem;
}
.about-lead em { color: var(--accent); font-style: italic; }

.about-body {
  color: var(--ink-muted);
  font-size: 1.08rem;
  max-width: 52ch;
}

/* Experience timeline */
.timeline { display: flex; flex-direction: column; gap: 2.2rem; }
.tl-item {
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: calc(var(--space-unit) * 1.6);
  position: relative;
  padding-left: 0;
}
.tl-period {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.08em;
  color: var(--ink-soft);
  text-transform: uppercase;
  padding-top: 0.35rem;
}
.tl-body { position: relative; padding-left: 1.4rem; border-left: 1px solid var(--hairline); }
.tl-body::before {
  content: "";
  position: absolute;
  left: -4px; top: 0.6rem;
  width: 7px; height: 7px;
  background: var(--accent);
  border-radius: 50%;
  transition: transform 320ms var(--ease-out), box-shadow 320ms var(--ease-out);
}
.tl-item:hover .tl-body::before {
  transform: scale(1.7);
  box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent) 18%, transparent);
}
.tl-role {
  font-family: var(--font-display);
  font-size: 1.4rem;
  color: var(--ink);
  margin-bottom: 0.1rem;
}
.tl-org {
  color: var(--ink-muted);
  font-style: italic;
  margin-bottom: 0.9rem;
  font-family: var(--font-display);
  font-size: 1.05rem;
}
.tl-bullets {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
}
.tl-bullets li {
  position: relative;
  padding-left: 1.2rem;
  color: var(--ink-muted);
  font-size: 1rem;
}
.tl-bullets li::before {
  content: "—";
  position: absolute; left: 0;
  color: var(--accent);
}
@media (max-width: 640px) {
  .tl-item { grid-template-columns: 1fr; gap: 0.4rem; }
  .tl-body { padding-left: 1.2rem; }
}

/* Projects grid */
.proj-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  border-top: 1px solid var(--hairline-soft);
}
.proj-card {
  padding: calc(var(--space-unit) * 1.4);
  border-bottom: 1px solid var(--hairline-soft);
  border-right: 1px solid var(--hairline-soft);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: background 320ms var(--ease-out);
}
.proj-card:nth-child(2n) { border-right: none; }
.proj-card::before {
  content: "";
  position: absolute;
  inset: auto 0 0 0;
  height: 1px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 420ms var(--ease-out);
}
.proj-card:hover { background: var(--paper-2); }
.proj-card:hover::before { transform: scaleX(1); }
.proj-title {
  font-family: var(--font-display);
  font-size: 1.35rem;
  margin-bottom: 0.4rem;
  transition: transform 320ms var(--ease-out);
}
.proj-card:hover .proj-title {
  transform: translateX(3px);
  color: var(--accent);
}
.proj-desc {
  color: var(--ink-muted);
  font-size: 0.98rem;
  margin-bottom: 1rem;
  max-width: 42ch;
}
.proj-tags {
  display: flex; flex-wrap: wrap; gap: 0.4rem;
}
.proj-tag {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.2rem 0.5rem;
  background: transparent;
  color: var(--ink-soft);
  border: 1px solid var(--hairline-soft);
  border-radius: 0;
}
@media (max-width: 640px) {
  .proj-grid { grid-template-columns: 1fr; }
  .proj-card { border-right: none; }
}

/* Skills */
.skills-grid {
  display: flex;
  flex-direction: column;
  gap: calc(var(--space-unit) * 1.3);
}
.skill-group-title {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 0.8rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--hairline-soft);
}
.skill-list {
  list-style: none; padding: 0; margin: 0;
  display: flex; flex-wrap: wrap; gap: 0.5rem;
}
.skill-list li {
  font-family: var(--font-body);
  font-size: 0.95rem;
  color: var(--ink);
  border: 1px solid var(--hairline);
  padding: 0.32rem 0.8rem;
  transition: border-color 260ms var(--ease-out), color 260ms var(--ease-out);
  cursor: default;
}
.skill-list li:hover { color: var(--accent); border-color: var(--accent); }
@media (max-width: 780px) { .skill-list li { font-size: 0.9rem; padding: 0.3rem 0.7rem; } }

/* Education */
.edu-list { display: flex; flex-direction: column; gap: 1.4rem; }
.edu-item {
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: calc(var(--space-unit) * 1.6);
}
.edu-item .tl-period { padding-top: 0.2rem; }
.edu-school { font-family: var(--font-display); font-size: 1.2rem; }
.edu-degree { color: var(--ink-muted); font-style: italic; }
@media (max-width: 640px) { .edu-item { grid-template-columns: 1fr; gap: 0.3rem; } }

/* Publications */
.pub-list { display: flex; flex-direction: column; gap: 1rem; }
.pub-item {
  padding: 1rem 0;
  border-bottom: 1px solid var(--hairline-soft);
}
.pub-title { font-family: var(--font-display); font-size: 1.15rem; }
.pub-venue {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.08em;
  color: var(--ink-soft);
  text-transform: uppercase;
  margin-top: 0.25rem;
}

/* Contact */
.contact-list { display: flex; flex-wrap: wrap; gap: 1rem; }
.contact-link {
  display: inline-flex;
  align-items: center;
  gap: 0.6em;
  padding: 0.7rem 1.2rem;
  border: 1px solid var(--hairline);
  font-family: var(--font-display);
  font-size: 1.05rem;
  transition: all 320ms var(--ease-out);
  position: relative;
  overflow: hidden;
}
.contact-link:hover {
  border-color: var(--accent);
  color: var(--accent);
}
@media (max-width: 900px) {
  .prof-layout { grid-template-columns: 1fr; }
  .prof-sidebar {
    position: static;
    flex-direction: row;
    overflow-x: auto;
    gap: 0.5rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--hairline-soft);
    scrollbar-width: thin;
  }
  .prof-sidebar .eyebrow, .prof-download { display: none; }
  .prof-side-link {
    border-left: none;
    border-bottom: 1px solid transparent;
    padding: 0.4rem 0.8rem;
    margin-left: 0;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .prof-side-link.active {
    border-left: none;
    border-bottom-color: var(--accent);
  }
  .prof-side-link:hover { transform: none; }
}

/* ──────────── FOOTPRINT page ──────────── */
.foot-header {
  max-width: 1400px;
  margin: 0 auto;
  padding: calc(var(--space-unit) * 2) calc(var(--space-unit) * 1.4) calc(var(--space-unit) * 0.5);
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: calc(var(--space-unit) * 3);
  align-items: end;
}
.foot-title {
  font-family: var(--font-display);
  font-size: clamp(2.2rem, 5vw, 3.6rem);
  line-height: 1.05;
  margin: 0 0 0.3rem 0;
  font-weight: 400;
}
.foot-title em { font-style: italic; color: var(--accent); }
.foot-subtitle {
  font-family: var(--font-display);
  font-style: italic;
  color: var(--ink-muted);
  font-size: 1.2rem;
  max-width: 40ch;
}
.foot-counts {
  display: flex; gap: calc(var(--space-unit) * 2);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.foot-counts b {
  display: block;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 2.2rem;
  color: var(--ink);
  letter-spacing: 0;
  text-transform: none;
  margin-bottom: 0.25rem;
}

.map-wrap {
  max-width: 1400px;
  margin: 0 auto;
  padding: calc(var(--space-unit) * 1.2) calc(var(--space-unit) * 1.4);
  position: relative;
}
.map-frame {
  border: 1px solid var(--hairline);
  background: var(--paper-2);
  position: relative;
  aspect-ratio: 2 / 1;
  overflow: hidden;
}
.map-svg { width: 100%; height: 100%; display: block; }

.pin {
  position: absolute;
  transform: translate(-50%, -50%);
  cursor: pointer;
  z-index: 2;
}
.pin-dot {
  width: 16px; height: 16px;
  color: var(--accent);
  display: block;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35));
  transition: all 320ms var(--ease-out);
}
.pin:hover .pin-dot,
.pin.active .pin-dot {
  transform: scale(1.35);
}
.route-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.pin-round { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--paper); filter: none; }
.pin-label {
  position: absolute;
  left: 16px; top: -8px;
  white-space: nowrap;
  background: var(--ink);
  color: var(--paper);
  padding: 0.35rem 0.7rem;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  pointer-events: none;
  opacity: 0;
  transform: translateX(-6px);
  transition: opacity 280ms var(--ease-out), transform 280ms var(--ease-out);
}
.pin:hover .pin-label,
.pin.active .pin-label {
  opacity: 1;
  transform: translateX(0);
}

.pin-pulse {
  position: absolute;
  top: 50%; left: 50%;
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 1px solid var(--accent);
  transform: translate(-50%, -50%);
  animation: pulse 2.4s var(--ease-out) infinite;
  pointer-events: none;
}
@keyframes pulse {
  0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
  100% { transform: translate(-50%, -50%) scale(4); opacity: 0; }
}

/* Trip list below map */
.trip-list-wrap {
  max-width: 1400px;
  margin: 0 auto;
  padding: calc(var(--space-unit) * 2) calc(var(--space-unit) * 1.4);
}
.trip-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 0;
  border-top: 1px solid var(--hairline);
  border-left: 1px solid var(--hairline);
}
.trip-card {
  padding: calc(var(--space-unit) * 1.3);
  border-right: 1px solid var(--hairline);
  border-bottom: 1px solid var(--hairline);
  cursor: pointer;
  position: relative;
  transition: background 320ms var(--ease-out);
  overflow: hidden;
}
.trip-card:hover, .trip-card.active { background: var(--paper-2); }
.trip-card .trip-date {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 0.5rem;
}
.trip-card .trip-place {
  font-family: var(--font-display);
  font-size: 1.4rem;
  margin-bottom: 0.3rem;
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  transition: transform 280ms var(--ease-out), color 280ms var(--ease-out);
}
.trip-flag {
  font-size: 1.15rem;
  line-height: 1;
  filter: saturate(0.92);
}
.trip-card:hover .trip-place { transform: translateX(3px); color: var(--accent); }
.trip-card .trip-note {
  color: var(--ink-muted);
  font-style: italic;
  font-family: var(--font-display);
  font-size: 1.02rem;
  max-width: 32ch;
}
.trip-photos {
  margin-top: 1rem;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.trip-photo {
  aspect-ratio: 4 / 3;
  background: var(--paper-2);
  border: 1px solid var(--hairline-soft);
  color: var(--ink-soft);
  transition: transform 320ms var(--ease-out), border-color 260ms var(--ease-out);
  overflow: hidden;
  position: relative;
}
.trip-photo svg { display: block; width: 100%; height: 100%; }
.trip-card:hover .trip-photo { border-color: var(--hairline); }
.trip-photo:hover { transform: scale(1.04); z-index: 2; border-color: var(--accent); }

/* Footprint responsive */
.other-grid{max-width:1100px;margin:0 auto;padding:0 calc(var(--space-unit)*1.4) calc(var(--space-unit)*3);display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:calc(var(--space-unit)*1)}
.other-card{border:1px solid var(--hairline-soft);padding:calc(var(--space-unit)*0.8);transition:border-color 300ms var(--ease-out)}
.other-card:hover{border-color:var(--accent)}
.other-num{font-family:var(--font-mono);font-size:.65rem;color:var(--ink-soft);letter-spacing:.1em;margin-bottom:.5rem}
.other-photo{aspect-ratio:4/3;margin-bottom:.7rem}
.other-title{font-family:var(--font-display);font-size:1.25rem}
@media (max-width:780px){.other-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width: 780px) {
  .foot-header { grid-template-columns: 1fr; gap: 1.2rem; }
  .foot-counts { gap: 1.4rem; }
}

/* ──────────── TWEAKS panel ──────────── */
.tweaks-panel {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 90;
  width: 280px;
  background: var(--paper);
  border: 1px solid var(--hairline);
  padding: 1rem 1.1rem 1.1rem;
  font-family: var(--font-body);
  box-shadow: 0 12px 40px -10px rgba(0,0,0,0.18);
  display: none;
  animation: panel-in 360ms var(--ease-out);
}
.tweaks-panel.on { display: block; }
@keyframes panel-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
.tweaks-title {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 0.9rem;
  padding-bottom: 0.6rem;
  border-bottom: 1px solid var(--hairline-soft);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.tweak-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.65rem;
  gap: 0.6rem;
}
.tweak-row:last-child { margin-bottom: 0; }
.tweak-label {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  color: var(--ink-muted);
  text-transform: uppercase;
}
.tweak-swatches {
  display: flex; gap: 0.3rem;
}
.tweak-swatch {
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 1px solid var(--hairline);
  cursor: pointer;
  transition: transform 220ms var(--ease-out);
}
.tweak-swatch:hover { transform: scale(1.15); }
.tweak-swatch.on { transform: scale(1.2); border-color: var(--ink); }

.tweak-select {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  padding: 0.3rem 0.5rem;
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--hairline);
  border-radius: 4px;
  cursor: pointer;
}

.tweak-toggle {
  display: inline-flex;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  overflow: hidden;
}
.tweak-toggle button {
  padding: 0.28rem 0.55rem;
  font-family: var(--font-mono);
  font-size: 0.66rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: transparent;
  color: var(--ink-muted);
  border: none;
  cursor: pointer;
}
.tweak-toggle button.on {
  background: var(--ink);
  color: var(--paper);
}

/* ──────────── Footer ──────────── */
.site-foot {
  border-top: 1px solid var(--hairline-soft);
  padding: calc(var(--space-unit) * 1.6) calc(var(--space-unit) * 1.4);
  max-width: 1400px;
  margin: 0 auto;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
}


/* ────────────────────────────────────────
   Additions for v2: projects with link cards,
   research/competitions timeline, edu coursework,
   sidebar meta, contact arrow span.
   ──────────────────────────────────────── */

.muted { color: var(--ink-soft); }

.prof-side-meta {
  margin-top: calc(var(--space-unit) * 1.2);
  padding-top: calc(var(--space-unit) * 0.9);
  border-top: 1px solid var(--hairline-soft);
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.04em;
  color: var(--ink-soft);
  line-height: 1.7;
  word-break: break-all;
}

/* Education coursework line */
.edu-course {
  margin-top: 0.4rem;
  font-family: var(--font-body);
  font-size: 0.96rem;
  color: var(--ink-muted);
}

/* Research / activities timeline desc paragraph */
.tl-desc {
  margin: 0.5rem 0 0.7rem;
  color: var(--ink-muted);
  font-size: 1.02rem;
  max-width: 60ch;
}

/* Project cards now anchors with meta + stack + arrow */
.proj-card {
  display: block;
  text-decoration: none;
  color: inherit;
}
.proj-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 0.7rem;
}
.proj-arrow {
  font-size: 1rem;
  letter-spacing: 0;
  transition: transform 320ms var(--ease-out);
  color: var(--ink-muted);
}
.proj-card:hover .proj-arrow {
  transform: translate(3px, -3px);
  color: var(--accent);
}
.proj-stack {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--ink-soft);
  letter-spacing: 0.02em;
  margin: 0.3rem 0 0.7rem;
}

/* Competitions */
.comp-list {
  display: flex;
  flex-direction: column;
  gap: calc(var(--space-unit) * 1.6);
}
.comp-item {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: calc(var(--space-unit) * 1.4);
  padding-bottom: calc(var(--space-unit) * 1.4);
  border-bottom: 1px solid var(--hairline-soft);
}
.comp-item:last-child { border-bottom: none; }
.comp-time {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.06em;
  color: var(--ink-soft);
  padding-top: 0.3rem;
}
.comp-title {
  font-family: var(--font-display);
  font-size: 1.45rem;
  letter-spacing: -0.005em;
  margin-bottom: 0.25rem;
}
.comp-award {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid color-mix(in oklab, var(--accent) 50%, var(--hairline));
  padding: 0.28rem 0.55rem;
  border-radius: 0;
  margin-bottom: 0.6rem;
  background: color-mix(in oklab, var(--accent) 6%, transparent);
}
.comp-metrics {
  display: flex;
  gap: calc(var(--space-unit) * 1.4);
  margin: 0.8rem 0 0.9rem;
  padding: 0.9rem 1.1rem;
  border: 1px solid var(--hairline-soft);
  border-left: 2px solid var(--accent);
  background: var(--paper-2);
}
.metric { display: flex; flex-direction: column; gap: 0.15rem; }
.metric-value {
  font-family: var(--font-display);
  font-size: 1.6rem;
  color: var(--accent);
  line-height: 1;
}
.metric-label {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
@media (max-width: 640px) {
  .comp-item { grid-template-columns: 1fr; gap: 0.3rem; }
  .comp-metrics { gap: 1.2rem; }
}

/* Contact link arrow (span instead of ::after) */
.contact-link {
  gap: 0.6em;
}
.contact-link .arr {
  transition: transform 320ms var(--ease-out);
  display: inline-block;
}
.contact-link:hover .arr { transform: translateX(4px); }

/* Home masthead (v3) */
.home{max-width:1400px;margin:0 auto;padding:calc(var(--space-unit)*3.2) calc(var(--space-unit)*1.4) calc(var(--space-unit)*2)}
.home-kicker{font-family:var(--font-mono);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:1.4rem}
.home-name{font-size:clamp(3.2rem,10.5vw,8.5rem);line-height:.98;font-weight:400;letter-spacing:-.02em;margin:0}
.home-name-en{display:block;font-style:italic;color:var(--accent);font-size:clamp(1.9rem,5.6vw,4.4rem);margin-top:.15em}
.home-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:calc(var(--space-unit)*3);border-top:1px solid var(--hairline);margin-top:calc(var(--space-unit)*2.6);padding:calc(var(--space-unit)*2) 0}
.home-intro{font-size:1.14rem;color:var(--ink-muted);max-width:56ch;margin:0}
.home-facts{display:flex;flex-direction:column;gap:.9rem;border-left:1px solid var(--hairline);padding-left:calc(var(--space-unit)*1.6)}
.home-fact{font-family:var(--font-body);font-size:1.02rem;color:var(--ink)}
.home-fact span{display:block;font-family:var(--font-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.15rem}
.home-doors{display:flex;flex-direction:column}
.hero-links{display:flex;flex-wrap:wrap;gap:.55rem .5rem;margin-top:.4rem}
.hero-links a{font-family:var(--font-mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);border:1px solid var(--hairline);padding:.45rem .8rem;transition:color 260ms var(--ease-out),border-color 260ms var(--ease-out)}
.hero-links a:hover{color:var(--accent);border-color:var(--accent)}
.hero-meta .sub{display:block;font-style:normal;font-size:.82rem;color:var(--ink-soft);margin-top:.18rem}
@keyframes riseIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.hero-anim .hero-eyebrow,.hero-anim .hero-title,.hero-anim .hero-tagline,.hero-anim .hero-intro,.hero-anim .hero-ctas{opacity:0;animation:riseIn 720ms var(--ease-out) forwards}
.hero-anim .hero-eyebrow{animation-delay:40ms}
.hero-anim .hero-title{animation-delay:140ms}
.hero-anim .hero-tagline{animation-delay:300ms}
.hero-anim .hero-intro{animation-delay:440ms}
.hero-anim .hero-ctas{animation-delay:580ms}
.hero-anim .hero-aside > *{opacity:0;animation:riseIn 720ms var(--ease-out) forwards}
.hero-anim .hero-aside > *:nth-child(1){animation-delay:520ms}
.hero-anim .hero-aside > *:nth-child(2){animation-delay:610ms}
.hero-anim .hero-aside > *:nth-child(3){animation-delay:700ms}
.hero-anim .hero-aside > *:nth-child(4){animation-delay:790ms}
.hero-anim .hero-aside > *:nth-child(5){animation-delay:880ms}
.hero-anim .hero-aside > *:nth-child(6){animation-delay:960ms}
@media (prefers-reduced-motion:reduce){.hero-anim *,.hero-anim .hero-aside > *{animation:none!important;opacity:1!important}}
.door{display:grid;grid-template-columns:auto auto 1fr auto;align-items:baseline;gap:calc(var(--space-unit)*1.4);padding:calc(var(--space-unit)*1.5) 0;border-top:1px solid var(--hairline);cursor:pointer;transition:color 300ms var(--ease-out)}
.door:last-child{border-bottom:1px solid var(--hairline)}
.door-num{font-family:var(--font-mono);font-size:.78rem;color:var(--ink-soft)}
.door-title{font-family:var(--font-display);font-size:clamp(1.7rem,3.8vw,2.8rem);line-height:1}
.door-sub{font-family:var(--font-display);font-style:italic;color:var(--ink-soft);font-size:1rem;justify-self:end}
.door-arr{font-size:1.4rem;transition:transform 300ms var(--ease-out)}
.door:hover{color:var(--accent)}
.door:hover .door-arr{transform:translateX(10px)}
@media (max-width:780px){.home-grid{grid-template-columns:1fr;gap:calc(var(--space-unit)*1.6)}.home-facts{border-left:none;padding-left:0;border-top:1px solid var(--hairline-soft);padding-top:calc(var(--space-unit)*1.4)}.door-sub{display:none}}

/* Professional sticky top section-nav (v3) */
.prof-topnav{position:sticky;top:68px;z-index:35;display:flex;align-items:center;gap:.1rem;overflow-x:auto;scrollbar-width:none;background:color-mix(in oklab,var(--paper) 92%,transparent);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--hairline-soft);padding:0 calc(var(--space-unit)*1.4)}
.prof-topnav::-webkit-scrollbar{display:none}
.pt-link{display:inline-flex;align-items:baseline;gap:.45rem;padding:.85rem .8rem;font-family:var(--font-body);font-size:.95rem;color:var(--ink-muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color 260ms var(--ease-out),border-color 260ms var(--ease-out)}
.pt-link .num{font-family:var(--font-mono);font-size:.66rem;color:var(--ink-soft);letter-spacing:.06em}
.pt-link:hover{color:var(--ink)}
.pt-link.active{color:var(--ink);border-bottom-color:var(--accent)}
.pt-link.active .num{color:var(--accent)}

.pt-download:hover{color:var(--accent)}

/* Mobile: section nav stays a top bar so content keeps full width */
@media (max-width:780px){
.brand{font-size:1rem;white-space:nowrap}
.prof-topnav{top:60px}
.pt-link{padding:.7rem .55rem;font-size:.88rem}
.pt-download{display:none}
}
/* Mobile: shrink the hero name so it never wraps */

const { useState, useEffect, useRef } = React;

function useLocal(key, initial) {
  const [v, setV] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      return raw == null ? initial : JSON.parse(raw);
    } catch { return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(v)); } catch {}
  }, [key, v]);
  return [v, setV];
}

const t = (val, lang) => (val && typeof val === "object" && "zh" in val) ? val[lang] : val;

function Spotlight({ enabled }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!enabled) return;
    let raf = 0, x = -500, y = -500, tx = -500, ty = -500;
    const onMove = (e) => { tx = e.clientX; ty = e.clientY; };
    const tick = () => {
      x += (tx - x) * 0.18;
      y += (ty - y) * 0.18;
      if (ref.current) ref.current.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%)`;
      raf = requestAnimationFrame(tick);
    };
    window.addEventListener("mousemove", onMove);
    raf = requestAnimationFrame(tick);
    return () => { window.removeEventListener("mousemove", onMove); cancelAnimationFrame(raf); };
  }, [enabled]);
  return <div ref={ref} className="spotlight" />;
}

function FadeIn({ children, delay = 0, as: As = "div", className = "", style, ...rest }) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    if (!ref.current) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) { setVis(true); io.disconnect(); }
      });
    }, { threshold: 0.12 });
    io.observe(ref.current);
    return () => io.disconnect();
  }, []);
  return (
    <As ref={ref} className={`fade-in ${vis ? "in" : ""} ${className}`} style={{ transitionDelay: delay + "ms", ...(style || {}) }} {...rest}>
      {children}
    </As>
  );
}

const projectLL = (lat, lng) => {
  const f = fishXY(((lng + 180) / 360) * 1000, ((90 - lat) / 180) * 500);
  return { left: `${f[0] / 10}%`, top: `${f[1] / 5}%` };
};

function dotField() {
  const pts = [];
  const regions = [
    [80, 80, 270, 220], [240, 230, 310, 410], [460, 95, 560, 170],
    [470, 175, 540, 380], [560, 100, 880, 240], [780, 305, 880, 375],
  ];
  regions.forEach(([x1, y1, x2, y2]) => {
    for (let x = x1; x < x2; x += 10) {
      for (let y = y1; y < y2; y += 10) {
        if (Math.sin(x * 12.9898 + y * 78.233) > -0.3) pts.push({ x, y });
      }
    }
  });
  return pts;
}

// Hand-traced, deliberately abstract — matches the editorial line aesthetic.

// Real geometry: Natural Earth via world-atlas TopoJSON, equirectangular to match projectLL
const MAP_PROJ = d3.geoEquirectangular().scale(1000 / (2 * Math.PI)).translate([500, 250]).precision(0.1);
// Fisheye magnification centered on Taiwan: Taiwan enlarges in place, surroundings shift outward
const FISH_C = [836.94, 184.17], FISH_R = 48, FISH_M = 12;
function fishXY(x, y) {
  const dx = x - FISH_C[0], dy = y - FISH_C[1];
  const r = Math.hypot(dx, dy);
  if (r >= FISH_R || r === 0) return [x, y];
  const rn = r / FISH_R;
  const k = ((FISH_M + 1) * rn) / (FISH_M * rn + 1);
  return [FISH_C[0] + (dx / r) * k * FISH_R, FISH_C[1] + (dy / r) * k * FISH_R];
}
const FISH_PROJ = { stream: (s) => MAP_PROJ.stream({ point(x, y) { const f = fishXY(x, y); s.point(f[0], f[1]); }, lineStart() { s.lineStart(); }, lineEnd() { s.lineEnd(); }, polygonStart() { s.polygonStart(); }, polygonEnd() { s.polygonEnd(); }, sphere() { if (s.sphere) s.sphere(); } }) };
const MAP_PATH = d3.geoPath(FISH_PROJ);
let worldCache = null;
function useWorld() {
  const [world, setWorld] = useState(worldCache);
  useEffect(() => {
    if (worldCache) return;
    let alive = true;
    fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json")
      .then(r => r.json())
      .then(topo => {
        const geoms = topo.objects.countries.geometries;
        worldCache = {
          land: topojson.merge(topo, geoms.filter(g => g.id !== "010")),
          borders: topojson.mesh(topo, topo.objects.countries, (a, b) => a !== b),
          taiwan: topojson.feature(topo, geoms.find(g => g.id === "158"))
        };
        if (alive) setWorld(worldCache);
      }).catch(() => {});
    return () => { alive = false; };
  }, []);
  return world;
}

function WorldMap({ mapStyle }) {
  const showGraticule = mapStyle !== "dots";
  const world = useWorld();
  const [dots, setDots] = useState(null);
  useEffect(() => {
    if (!world || mapStyle !== "dots" || dots) return;
    const cv = document.createElement("canvas"); cv.width = 1000; cv.height = 500;
    const cx = cv.getContext("2d");
    const cp = d3.geoPath(FISH_PROJ, cx);
    cx.beginPath(); cp(world.land); cx.fill();
    const img = cx.getImageData(0, 0, 1000, 500).data;
    const pts = [];
    for (let y = 3; y < 500; y += 7) for (let x = 3; x < 1000; x += 7) if (img[(y * 1000 + x) * 4 + 3] > 128) pts.push({ x, y });
    setDots(pts);
  }, [world, mapStyle]);
  return (
    <svg viewBox="0 0 1000 500" className="map-svg" preserveAspectRatio="xMidYMid meet">
      {/* graticule */}
      {showGraticule && (
        <g stroke="var(--hairline-soft)" strokeWidth="0.4" fill="none" opacity="0.55">
          {[0, 83, 167, 250, 333, 417, 500].map((y, i) => (
            <line key={"h" + i} x1="0" x2="1000" y1={y} y2={y} />
          ))}
          {[0, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000].map((x, i) => (
            <line key={"v" + i} x1={x} x2={x} y1="0" y2="500" />
          ))}
          {/* equator + prime meridian, slightly stronger */}
          <line x1="0" x2="1000" y1="250" y2="250" stroke="var(--hairline)" strokeWidth="0.5" strokeDasharray="4 5" />
          <line x1="500" x2="500" y1="0" y2="500" stroke="var(--hairline)" strokeWidth="0.5" strokeDasharray="4 5" />
        </g>
      )}

      {/* land */}
      {mapStyle === "dots" ? (
        <g fill="var(--ink-soft)" opacity="0.5">
          {(dots || dotField()).map((p, i) => (<circle key={i} cx={p.x} cy={p.y} r="1.1" />))}
        </g>
      ) : world ? (
        <g>
          <path d={MAP_PATH(world.land)} fill="var(--paper-2)" stroke="var(--ink-muted)" strokeWidth="0.7" strokeLinejoin="round" />
          <path d={MAP_PATH(world.borders)} fill="none" stroke="var(--hairline)" strokeWidth="0.4" />
          <path d={MAP_PATH(world.taiwan)} fill="#6B2B2A" stroke="var(--accent)" strokeWidth="1.2" strokeLinejoin="round" />
          <circle cx={FISH_C[0]} cy={FISH_C[1]} r={FISH_R} fill="none" stroke="var(--ink-soft)" strokeWidth="0.8" opacity="0.55" />
          <circle cx={FISH_C[0]} cy={FISH_C[1]} r={FISH_R + 3.5} fill="none" stroke="var(--ink-soft)" strokeWidth="0.4" opacity="0.3" />
          <line x1={FISH_C[0] + FISH_R * 0.72} y1={FISH_C[1] + FISH_R * 0.72} x2={FISH_C[0] + FISH_R * 1.18} y2={FISH_C[1] + FISH_R * 1.18} stroke="var(--ink-soft)" strokeWidth="3" strokeLinecap="round" opacity="0.45" />
          <text x="893" y="178" textAnchor="start" fill="var(--accent)" style={{ font: "italic 14px var(--font-display)" }}>my home</text>
        </g>
      ) : (
        <g fill="none" stroke="var(--ink-muted)" strokeWidth="1.1" strokeLinejoin="round" strokeLinecap="round">
          {WORLD_PATHS.map((d, i) => <path key={i} d={d} />)}
        </g>
      )}
    </svg>
  );
}

function Footprint({ lang, mapStyle }) {

  const fmtDate = (s) => { const parts = s.split("–").map(x => x.trim()); const a = ymTok(parts[0], ""); if (parts.length < 2 || !parts[1]) return a; const b = ymTok(parts[1], parts[0].split(".")[0]); return b === a ? a : a + " – " + b; };

          <svg className="route-svg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
            {(() => { const P = (lat, lng) => fishXY(((lng + 180) / 360) * 1000, ((90 - lat) / 180) * 500); const home = P(23.7, 121.0); const usBase = P(40.1, -88.2); const fromUS = ["niagara", "sf", "austin", "lv", "miami", "orlando", "nyc", "dc", "nola"];
              const arc = (a, b) => { const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2; const lift = Math.min(60, Math.hypot(b[0] - a[0], b[1] - a[1]) * 0.22); return `M ${a[0]} ${a[1]} Q ${mx} ${my - lift} ${b[0]} ${b[1]}`; };
              return d.trips.filter(tr => tr.flag !== "🇹🇼").map(tr => { const b = P(tr.lat, tr.lng); const o = fromUS.includes(tr.id) ? usBase : home; let bx = b[0]; const paths = []; if (bx - o[0] > 500) bx -= 1000; else if (bx - o[0] < -500) bx += 1000; paths.push(arc(o, [bx, b[1]])); if (bx !== b[0]) paths.push(arc([o[0] - (bx - b[0]), o[1]], b));
                return paths.map((p, i) => <path key={tr.id + i} d={p} fill="none" stroke="var(--accent)" strokeWidth={active === tr.id ? 1.6 : 0.9} strokeDasharray="5 5" opacity={active === tr.id ? 0.95 : 0.4} />); }); })()}
          </svg>
          {d.trips.map((trip) => {
            const pos = projectLL(trip.lat, trip.lng);
            const isActive = active === trip.id;
            return (
              <div key={trip.id} className={`pin ${isActive ? "active" : ""}`} style={pos}
                onMouseEnter={() => setActive(trip.id)}
                onMouseLeave={() => setActive(null)}
                onClick={() => {
                  const el = document.getElementById("trip-" + trip.id);
                  if (el) {
                    const rect = el.getBoundingClientRect();

                    window.scrollTo({ top: y, behavior: "smooth" });
                  }

                <div style={{ position: "relative" }}>
                  {trip.flag === "🇹🇼" ? <div className="pin-dot pin-round"></div> : (trip.id === "jp-cruise" || trip.id === "jp-2017") ? <svg className="pin-dot" viewBox="0 0 24 24" fill="currentColor"><rect x="10" y="7" width="4" height="5"/><rect x="11" y="4" width="2" height="3"/><path d="M4 14.5l8-2.8 8 2.8-1.8 5H5.8z"/></svg> : <svg className="pin-dot" viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 15.5v-2l-8.5-5V3.2a1.3 1.3 0 0 0-2.6 0v5.3l-8.5 5v2l8.5-2.6v5.4l-2.2 1.6v1.6l3.5-1 3.5 1v-1.6l-2.2-1.6v-5.4z"/></svg>}
                  {isActive && <div className="pin-pulse" />}
                </div>

      </FadeIn>

                      </svg>

    </>
  );
}

      {view === "home" && <Home lang={lang} setView={setView} />}
      {view === "prof" && <Professional lang={lang} />}
      {view === "foot" && <Footprint lang={lang} mapStyle={mapStyle} />}
      {view === "other" && <OtherMe lang={lang} />}
      <footer className="site-foot">
        <div>© 2026 · {t(window.SITE_DATA.profile.name, lang)}</div>
      </footer>
      <Tweaks open={tweaksOpen} setOpen={setTweaksOpen} lang={lang}
        accent={accent} setAccent={setAccent}
        font={font} setFont={setFont}
        density={density} setDensity={setDensity}
        cursor={cursor} setCursor={setCursor}
        mapStyle={mapStyle} setMapStyle={setMapStyle}
        navSide={navSide} setNavSide={setNavSide} />
      {!introDone && window.Intro && <window.Intro onDone={() => setIntroDone(true)} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
